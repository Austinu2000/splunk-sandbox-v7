# Explicit optional fictional profile; never migrates or rewrites existing environments.
id: enterprise_lab_v1
name: Enterprise Automation Lab v1
description: Optional fictional V7 topology. Six indexers across two sites, three clustered search heads, a Deployer and an Ansible workspace. Existing Lab, APL and Erie saves are independent.
role: Learner
seed: enterprise-lab-v1
scale: { targetDailyIngestTB: 0.01, fleetSize: 50, users: 1 }
sites:
  - { id: primary, name: Primary lab site, weight: 0.5, subnet: 61 }
  - { id: recovery, name: Recovery lab site, weight: 0.5, subnet: 62 }
infra:
  indexerCluster: { indexers: 6, multisite: true, sitePlacement: {primary: 3, recovery: 3}, replicationFactor: 3, searchFactor: 2 }
  searchHeadCluster: { members: 3, deployer: true }
  esSearchHead: false
  deploymentServers: 1
  licenseManager: true
  monitoringConsole: true
  heavyForwarders:
    - { name: hf01, site: primary, role: syslog }
  extras: []
auth: { method: native, roleMappings: [] }
apps: [Splunk_TA_nix, Splunk_TA_windows]
serverClasses:
  - { id: linux_servers, short: lnx, os: linux, weight: 0.7, baseThroughputKBps: 8, outputs: indexers }
  - { id: win_servers, short: win, os: windows, weight: 0.3, baseThroughputKBps: 10, outputs: indexers }
indexes:
  - { name: os, retentionDays: 30 }
  - { name: wineventlog, retentionDays: 30 }
dataSources:
  - { id: linux, sourcetypes: [linux_secure, syslog], index: os, via: forwarders, shareOfIngest: 0.7 }
  - { id: windows, sourcetypes: [XmlWinEventLog], index: wineventlog, via: forwarders, shareOfIngest: 0.3 }
scenarios: { core: [], profile: [] }
