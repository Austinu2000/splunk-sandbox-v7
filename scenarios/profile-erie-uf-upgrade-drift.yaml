id: erie-uf-upgrade-drift
title: Older forwarders stopped sending after an upgrade wave
profiles:
  - erie
summary: An indexer TLS policy only accepts TLS 1.3; older forwarders cannot
  negotiate with it.
topics:
  - erie
  - configuration
  - operations
difficulty: medium
trigger:
  onDemand: true
ticket:
  requester: Platform Operations
  persona: methodical
  urgency: high
  text: Older forwarders stopped sending after an upgrade wave. Investigate the
    affected service, correct its configuration, and verify recovery.
changes:
  - host: "{indexer:1}"
    path: /opt/splunk/etc/system/local/server.conf
    stanza: sslConfig
    set:
      sslVersions: tls1.3
    apply: restart
clues:
  - "{indexer:1}: /opt/splunk/etc/system/local/server.conf [sslConfig]"
  - splunk show profile-status on the affected host
  - Apps → Engineer Sandbox → Operations
redHerrings: []
fixChecks:
  fleet:
    health: stale_phonehome
    maxPct: 3
recovery:
  seconds: 30
interview:
  prompt: Older forwarders stopped sending after an upgrade wave. Walk through
    diagnosis, a scoped fix, and verification.
  timeLimitMinutes: 20
  expectedPath:
    - id: scope
      label: Scoped the affected environment
      any:
        - page: ^(environments|fleet|operations|monitoring)
        - cmd: show\s+profile-status
    - id: inspect
      label: Inspected the effective configuration
      any:
        - cmd: btool|cat|less|grep
  verification:
    - cmd: show\s+profile-status|run\s+playbook
    - page: ^operations
    - search: index=
  unsafe:
    - label: Disabling TLS on indexers
      match:
        cmd: enableSplunkdSSL\s*=\s*false|sslVersions\s*=\s*\*
  rootCause:
    - label: An indexer TLS policy only accepts TLS 1.3; older forwarders cannot
        negotiate with it.
      any:
        - sslConfig
        - sslVersions
  hints:
    - cost: 10
      text: Inspect the effective configuration on {indexer:1}. File edits need the
        correct reload or restart.
  modelAnswer:
    rootCause: An indexer TLS policy only accepts TLS 1.3; older forwarders cannot
      negotiate with it.
    fix: '{indexer:1}: {"sslVersions":"tls1.2,tls1.3"} in
      /opt/splunk/etc/system/local/server.conf, then splunk restart'
    verification: Confirm the operational metrics have recovered, inspect fresh
      data, and close the ticket with evidence.
    prevention: Validate configuration before rollout, monitor the affected service,
      and test changes on a limited scope.
  spokenAnswer: An indexer TLS policy only accepts TLS 1.3; older forwarders
    cannot negotiate with it. I would scope the affected service, inspect its
    effective configuration and logs, apply a targeted correction with the
    appropriate reload, then verify fresh data and recovered metrics.

interviewQuestionIds:
  - "IQ010"
followups:
  - "Have you performed Splunk upgrades in production? Which tooling did you use, and how did you mitigate risk and downtime?"
  - "What would you check next if this change failed?"
  - "How would you verify recovery without hiding data loss?"
requestedEvidence:
  - "Scope the affected service before changing it."
  - "Record the failing hop and winning configuration, with a rejected alternative."
  - "Verify recovery after the correct application step and describe rollback."
  - "Give a stakeholder update and a prevention action."
