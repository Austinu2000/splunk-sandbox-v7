id: apl-aws-flowlogs-stalled
title: AWS VPC Flow Logs have stopped
profiles:
  - apl
summary: The AWS input is using an expired simulated credential.
topics:
  - apl
  - configuration
  - operations
difficulty: medium
trigger:
  onDemand: true
ticket:
  requester: Security Operations
  persona: methodical
  urgency: high
  text: AWS VPC Flow Logs have stopped. Investigate the affected service, correct
    its configuration, and verify recovery.
changes:
  - host: hf-aws01
    path: /opt/splunk/etc/system/local/inputs.conf
    stanza: aws_vpc_flow
    set:
      credential: simulated-expired
    apply: restart
clues:
  - "hf-aws01: /opt/splunk/etc/system/local/inputs.conf [aws_vpc_flow]"
  - splunk show profile-status on the affected host
  - Apps → Engineer Sandbox → Operations
redHerrings: []
fixChecks:
  metric:
    host: hf-aws01
    metric: aws_vpc_flow.receiving
    equals: true
recovery:
  seconds: 30
interview:
  prompt: AWS VPC Flow Logs have stopped. Walk through diagnosis, a scoped fix,
    and verification.
  timeLimitMinutes: 20
  expectedPath:
    - id: scope
      label: Scoped the affected environment
      any:
        - page: ^(environments|fleet|operations|monitoring)
        - cmd: show\s+profile-status
    - id: inspect
      label: Inspected the effective configuration
      any:
        - cmd: btool|cat|less|grep
  verification:
    - cmd: show\s+profile-status|run\s+playbook
    - page: ^operations
    - search: index=
  unsafe:
    - label: Recreating the aws index
      match:
        cmd: (rm|delete|remove).*aws
  rootCause:
    - label: The AWS input is using an expired simulated credential.
      any:
        - aws_vpc_flow
        - credential
  hints:
    - cost: 10
      text: Inspect the effective configuration on hf-aws01. File edits need the
        correct reload or restart.
  modelAnswer:
    rootCause: The AWS input is using an expired simulated credential.
    fix: 'hf-aws01: {"credential":"simulated-current"} in
      /opt/splunk/etc/system/local/inputs.conf, then splunk restart'
    verification: Confirm the operational metrics have recovered, inspect fresh
      data, and close the ticket with evidence.
    prevention: Validate configuration before rollout, monitor the affected service,
      and test changes on a limited scope.
  spokenAnswer: The AWS input is using an expired simulated credential. I would
    scope the affected service, inspect its effective configuration and logs,
    apply a targeted correction with the appropriate reload, then verify fresh
    data and recovered metrics.

interviewQuestionIds:
  - "IQ126"
  - "IQ153"
followups:
  - "How have you integrated AWS (or other clouds) with Splunk? Which services, and which collection method (push vs. pull, S3+SQS)?"
  - "Data from a forwarder/source is missing or not searchable. Where do you start, and which commands/logs do you check?"
  - "What would you check next if this change failed?"
  - "How would you verify recovery without hiding data loss?"
requestedEvidence:
  - "Scope the affected service before changing it."
  - "Record the failing hop and winning configuration, with a rejected alternative."
  - "Verify recovery after the correct application step and describe rollback."
  - "Give a stakeholder update and a prevention action."
