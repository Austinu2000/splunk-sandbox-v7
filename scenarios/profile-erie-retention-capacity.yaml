id: erie-retention-capacity
title: Auditors cannot find 90-day-old Windows data
profiles:
  - erie
summary: A size cap evicts the wineventlog index before its 90-day time retention.
topics:
  - erie
  - configuration
  - operations
difficulty: medium
trigger:
  onDemand: true
ticket:
  requester: Platform Operations
  persona: methodical
  urgency: high
  text: Auditors cannot find 90-day-old Windows data. Investigate the affected
    service, correct its configuration, and verify recovery.
changes:
  - host: "{indexer:1}"
    path: /opt/splunk/etc/peer-apps/_cluster/local/indexes.conf
    stanza: wineventlog
    set:
      maxTotalDataSizeMB: "1000"
    apply: restart
clues:
  - "{indexer:1}: /opt/splunk/etc/peer-apps/_cluster/local/indexes.conf
    [wineventlog]"
  - splunk show profile-status on the affected host
  - Apps → Engineer Sandbox → Operations
redHerrings: []
fixChecks:
  metric:
    host: "{indexer:1}"
    metric: retentionSatisfied
    equals: true
recovery:
  seconds: 30
interview:
  prompt: Auditors cannot find 90-day-old Windows data. Walk through diagnosis, a
    scoped fix, and verification.
  timeLimitMinutes: 20
  expectedPath:
    - id: scope
      label: Scoped the affected environment
      any:
        - page: ^(environments|fleet|operations|monitoring)
        - cmd: show\s+profile-status
    - id: inspect
      label: Inspected the effective configuration
      any:
        - cmd: btool|cat|less|grep
  verification:
    - cmd: show\s+profile-status|run\s+playbook
    - page: ^operations
    - search: index=
  unsafe:
    - label: Lowering retention instead of providing capacity
      match:
        cmd: frozenTimePeriodInSecs\s*=\s*[0-9]{1,6}\b
  rootCause:
    - label: A size cap evicts the wineventlog index before its 90-day time retention.
      any:
        - wineventlog
        - maxTotalDataSizeMB
  hints:
    - cost: 10
      text: Inspect the effective configuration on {indexer:1}. File edits need the
        correct reload or restart.
  modelAnswer:
    rootCause: A size cap evicts the wineventlog index before its 90-day time retention.
    fix: '{indexer:1}: {"maxTotalDataSizeMB":"1000000000"} in
      /opt/splunk/etc/peer-apps/_cluster/local/indexes.conf, then splunk
      restart'
    verification: Confirm the operational metrics have recovered, inspect fresh
      data, and close the ticket with evidence.
    prevention: Validate configuration before rollout, monitor the affected service,
      and test changes on a limited scope.
  spokenAnswer: A size cap evicts the wineventlog index before its 90-day time
    retention. I would scope the affected service, inspect its effective
    configuration and logs, apply a targeted correction with the appropriate
    reload, then verify fresh data and recovered metrics.

interviewQuestionIds:
  - "IQ005"
  - "IQ022"
followups:
  - "Explain the Splunk bucket lifecycle and how it relates to retention."
  - "How do you set retention for an index? What is your standard policy for searchable vs. archived data?"
  - "What would you check next if this change failed?"
  - "How would you verify recovery without hiding data loss?"
requestedEvidence:
  - "Scope the affected service before changing it."
  - "Record the failing hop and winning configuration, with a rejected alternative."
  - "Verify recovery after the correct application step and describe rollback."
  - "Give a stakeholder update and a prevention action."
