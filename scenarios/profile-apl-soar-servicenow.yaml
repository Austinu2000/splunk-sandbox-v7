id: apl-soar-servicenow
title: SOAR stopped opening ServiceNow tickets
profiles:
  - apl
summary: A rotated ServiceNow credential was not updated in the simulated SOAR
  asset. No real ServiceNow requests are made.
topics:
  - apl
  - configuration
  - operations
difficulty: medium
trigger:
  onDemand: true
ticket:
  requester: Security Operations
  persona: methodical
  urgency: high
  text: SOAR stopped opening ServiceNow tickets. Investigate the affected service,
    correct its configuration, and verify recovery.
changes:
  - host: soar01
    path: /opt/splunk/etc/system/local/assets.conf
    stanza: servicenow
    set:
      credential: simulated-expired
    apply: restart
clues:
  - "soar01: /opt/splunk/etc/system/local/assets.conf [servicenow]"
  - splunk show profile-status on the affected host
  - Apps → Engineer Sandbox → Operations
redHerrings: []
fixChecks:
  metric:
    host: soar01
    metric: playbookSuccess
    equals: true
recovery:
  seconds: 30
interview:
  prompt: SOAR stopped opening ServiceNow tickets. Walk through diagnosis, a
    scoped fix, and verification.
  timeLimitMinutes: 20
  expectedPath:
    - id: scope
      label: Scoped the affected environment
      any:
        - page: ^(environments|fleet|operations|monitoring)
        - cmd: show\s+profile-status
    - id: inspect
      label: Inspected the effective configuration
      any:
        - cmd: btool|cat|less|grep
  verification:
    - cmd: show\s+profile-status|run\s+playbook
    - page: ^operations
    - search: index=
  unsafe:
    - label: Deleting the playbook
      match:
        cmd: (rm|delete|remove).*playbook|playbook\s*=\s*$
  rootCause:
    - label: A rotated ServiceNow credential was not updated in the simulated SOAR
        asset. No real ServiceNow requests are made.
      any:
        - servicenow
        - credential
  hints:
    - cost: 10
      text: Inspect the effective configuration on soar01. File edits need the correct
        reload or restart.
  modelAnswer:
    rootCause: A rotated ServiceNow credential was not updated in the simulated SOAR
      asset. No real ServiceNow requests are made.
    fix: 'soar01: {"credential":"simulated-current"} in
      /opt/splunk/etc/system/local/assets.conf, then splunk restart; run splunk
      run playbook create_ticket'
    verification: Confirm the operational metrics have recovered, inspect fresh
      data, and close the ticket with evidence.
    prevention: Validate configuration before rollout, monitor the affected service,
      and test changes on a limited scope.
  spokenAnswer: A rotated ServiceNow credential was not updated in the simulated
    SOAR asset. No real ServiceNow requests are made. I would scope the affected
    service, inspect its effective configuration and logs, apply a targeted
    correction with the appropriate reload, then verify fresh data and recovered
    metrics.

interviewQuestionIds:
  - "IQ081"
  - "IQ082"
  - "IQ151"
followups:
  - "What SOAR (Phantom) / ServiceNow playbook experience do you have? Walk through an example."
  - "How did you integrate Splunk alerts and dashboards with ServiceNow?"
  - "What would you check next if this change failed?"
  - "How would you verify recovery without hiding data loss?"
requestedEvidence:
  - "Scope the affected service before changing it."
  - "Record the failing hop and winning configuration, with a rejected alternative."
  - "Verify recovery after the correct application step and describe rollback."
  - "Give a stakeholder update and a prevention action."
