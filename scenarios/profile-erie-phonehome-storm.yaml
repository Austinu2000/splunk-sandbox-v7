id: erie-phonehome-storm
title: Forwarder Management is slow after a deployment-server restart
profiles:
  - erie
summary: The forwarder phone-home interval is 10 seconds, saturating the
  deployment server.
topics:
  - erie
  - configuration
  - operations
difficulty: medium
trigger:
  onDemand: true
ticket:
  requester: Platform Operations
  persona: methodical
  urgency: high
  text: Forwarder Management is slow after a deployment-server restart.
    Investigate the affected service, correct its configuration, and verify
    recovery.
changes:
  - host: "{deployment_server}"
    path: /opt/splunk/etc/deployment-apps/org_all_deploymentclient/local/deploymentclient.conf
    stanza: deployment-client
    set:
      phoneHomeIntervalInSecs: "10"
    apply: deploy-server
clues:
  - "{deployment_server}:
    /opt/splunk/etc/deployment-apps/org_all_deploymentclient/local/deploymentcl\
    ient.conf [deployment-client]"
  - splunk show profile-status on the affected host
  - Apps → Engineer Sandbox → Operations
redHerrings: []
fixChecks:
  metric:
    host: "{deployment_server}"
    metric: phoneHomeLatency
    equals: 1
recovery:
  seconds: 30
interview:
  prompt: Forwarder Management is slow after a deployment-server restart. Walk
    through diagnosis, a scoped fix, and verification.
  timeLimitMinutes: 20
  expectedPath:
    - id: scope
      label: Scoped the affected environment
      any:
        - page: ^(environments|fleet|operations|monitoring)
        - cmd: show\s+profile-status
    - id: inspect
      label: Inspected the effective configuration
      any:
        - cmd: btool|cat|less|grep
  verification:
    - cmd: show\s+profile-status|run\s+playbook
    - page: ^operations
    - search: index=
  unsafe:
    - label: Restarting every forwarder
      match:
        cmd: splunk\s+(restart|stop)
        role: universal_forwarder
  rootCause:
    - label: The forwarder phone-home interval is 10 seconds, saturating the
        deployment server.
      any:
        - deployment-client
        - phoneHomeIntervalInSecs
  hints:
    - cost: 10
      text: Inspect the effective configuration on {deployment_server}. File edits
        need the correct reload or restart.
  modelAnswer:
    rootCause: The forwarder phone-home interval is 10 seconds, saturating the
      deployment server.
    fix: '{deployment_server}: {"phoneHomeIntervalInSecs":"60"} in
      /opt/splunk/etc/deployment-apps/org_all_deploymentclient/local/deploymentclient.conf,
      then splunk reload deploy-server'
    verification: Confirm the operational metrics have recovered, inspect fresh
      data, and close the ticket with evidence.
    prevention: Validate configuration before rollout, monitor the affected service,
      and test changes on a limited scope.
  spokenAnswer: The forwarder phone-home interval is 10 seconds, saturating the
    deployment server. I would scope the affected service, inspect its effective
    configuration and logs, apply a targeted correction with the appropriate
    reload, then verify fresh data and recovered metrics.

interviewQuestionIds:
  - "IQ032"
followups:
  - "What happens if a server class is misconfigured on the deployment server?"
  - "What would you check next if this change failed?"
  - "How would you verify recovery without hiding data loss?"
requestedEvidence:
  - "Scope the affected service before changing it."
  - "Record the failing hop and winning configuration, with a rejected alternative."
  - "Verify recovery after the correct application step and describe rollback."
  - "Give a stakeholder update and a prevention action."
