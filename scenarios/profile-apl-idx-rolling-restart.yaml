id: apl-idx-rolling-restart
title: Indexer is unavailable during a patch window
profiles:
  - apl
summary: A peer was taken out of service without maintenance mode; recovery
  requires a coordinated restart and bucket fixup.
topics:
  - apl
  - configuration
  - operations
difficulty: medium
trigger:
  onDemand: true
ticket:
  requester: Security Operations
  persona: methodical
  urgency: high
  text: Indexer is unavailable during a patch window. Investigate the affected
    service, correct its configuration, and verify recovery.
changes:
  - host: "{cluster_manager}"
    path: /opt/splunk/etc/system/local/server.conf
    stanza: clustering
    set:
      maintenance_mode: "false"
    apply: restart
  - host: "{indexer:2}"
    path: /opt/splunk/etc/system/local/inputs.conf
    stanza: splunktcp://9997
    set:
      disabled: "1"
    apply: restart
clues:
  - "{cluster_manager}: /opt/splunk/etc/system/local/server.conf [clustering];
    {indexer:2}: /opt/splunk/etc/system/local/inputs.conf [splunktcp://9997]"
  - splunk show profile-status on the affected host
  - Apps → Engineer Sandbox → Operations
redHerrings: []
fixChecks:
  all:
    - metric:
        host: "{cluster_manager}"
        metric: fixupComplete
        equals: true
    - effectiveConf:
        host: "{indexer:2}"
        conf: inputs
        stanza: splunktcp://9997
        key: disabled
        equals: "0"
recovery:
  seconds: 30
interview:
  prompt: Indexer is unavailable during a patch window. Walk through diagnosis, a
    scoped fix, and verification.
  timeLimitMinutes: 20
  expectedPath:
    - id: scope
      label: Scoped the affected environment
      any:
        - page: ^(environments|fleet|operations|monitoring)
        - cmd: show\s+profile-status
    - id: inspect
      label: Inspected the effective configuration
      any:
        - cmd: btool|cat|less|grep
  verification:
    - cmd: show\s+profile-status|run\s+playbook
    - page: ^operations
    - search: index=
  unsafe:
    - label: Taking several peers offline with enforce-counts
      match:
        cmd: offline.*enforce-counts
  rootCause:
    - label: A peer was taken out of service without maintenance mode; recovery
        requires a coordinated restart and bucket fixup.
      any:
        - clustering
        - maintenance_mode
  hints:
    - cost: 10
      text: Inspect the effective configuration on {cluster_manager}. File edits need
        the correct reload or restart.
  modelAnswer:
    rootCause: A peer was taken out of service without maintenance mode; recovery
      requires a coordinated restart and bucket fixup.
    fix: '{cluster_manager}: {"maintenance_mode":"false"} in
      /opt/splunk/etc/system/local/server.conf, then splunk restart;
      {indexer:2}: {"disabled":"0"} in /opt/splunk/etc/system/local/inputs.conf,
      then splunk restart'
    verification: Confirm the operational metrics have recovered, inspect fresh
      data, and close the ticket with evidence.
    prevention: Validate configuration before rollout, monitor the affected service,
      and test changes on a limited scope.
  spokenAnswer: A peer was taken out of service without maintenance mode; recovery
    requires a coordinated restart and bucket fixup. I would scope the affected
    service, inspect its effective configuration and logs, apply a targeted
    correction with the appropriate reload, then verify fresh data and recovered
    metrics.

interviewQuestionIds:
  - "IQ010"
followups:
  - "Have you performed Splunk upgrades in production? Which tooling did you use, and how did you mitigate risk and downtime?"
  - "What would you check next if this change failed?"
  - "How would you verify recovery without hiding data loss?"
requestedEvidence:
  - "Scope the affected service before changing it."
  - "Record the failing hop and winning configuration, with a rejected alternative."
  - "Verify recovery after the correct application step and describe rollback."
  - "Give a stakeholder update and a prevention action."
