id: apl-sep-cim
title: Symantec malware dashboards show no matches
profiles:
  - apl
summary: The malware event type still searches the old Symantec sourcetype after
  an add-on upgrade.
topics:
  - apl
  - configuration
  - operations
difficulty: medium
trigger:
  onDemand: true
ticket:
  requester: Security Operations
  persona: methodical
  urgency: high
  text: Symantec malware dashboards show no matches. Investigate the affected
    service, correct its configuration, and verify recovery.
changes:
  - host: es01
    path: /opt/splunk/etc/system/local/eventtypes.conf
    stanza: symantec_malware
    set:
      search: sourcetype=symantec:old
    apply: restart
clues:
  - "es01: /opt/splunk/etc/system/local/eventtypes.conf [symantec_malware]"
  - splunk show profile-status on the affected host
  - Apps → Engineer Sandbox → Operations
redHerrings: []
fixChecks:
  metric:
    host: es01
    metric: malwareMapped
    equals: true
recovery:
  seconds: 30
interview:
  prompt: Symantec malware dashboards show no matches. Walk through diagnosis, a
    scoped fix, and verification.
  timeLimitMinutes: 20
  expectedPath:
    - id: scope
      label: Scoped the affected environment
      any:
        - page: ^(environments|fleet|operations|monitoring)
        - cmd: show\s+profile-status
    - id: inspect
      label: Inspected the effective configuration
      any:
        - cmd: btool|cat|less|grep
  verification:
    - cmd: show\s+profile-status|run\s+playbook
    - page: ^operations
    - search: index=
  unsafe:
    - label: Hardcoding dashboard results
      match:
        cmd: makeresults|eval.*count\s*=\s*[0-9]
  rootCause:
    - label: The malware event type still searches the old Symantec sourcetype after
        an add-on upgrade.
      any:
        - symantec_malware
        - search
  hints:
    - cost: 10
      text: Inspect the effective configuration on es01. File edits need the correct
        reload or restart.
  modelAnswer:
    rootCause: The malware event type still searches the old Symantec sourcetype
      after an add-on upgrade.
    fix: 'es01: {"search":"sourcetype=symantec:ep:*"} in
      /opt/splunk/etc/system/local/eventtypes.conf, then splunk restart'
    verification: Confirm the operational metrics have recovered, inspect fresh
      data, and close the ticket with evidence.
    prevention: Validate configuration before rollout, monitor the affected service,
      and test changes on a limited scope.
  spokenAnswer: The malware event type still searches the old Symantec sourcetype
    after an add-on upgrade. I would scope the affected service, inspect its
    effective configuration and logs, apply a targeted correction with the
    appropriate reload, then verify fresh data and recovered metrics.

interviewQuestionIds:
  - "IQ071"
followups:
  - "What is CIM, why does it matter, and how do you normalize data (e.g., firewall logs) to it?"
  - "What would you check next if this change failed?"
  - "How would you verify recovery without hiding data loss?"
requestedEvidence:
  - "Scope the affected service before changing it."
  - "Record the failing hop and winning configuration, with a rejected alternative."
  - "Verify recovery after the correct application step and describe rollback."
  - "Give a stakeholder update and a prevention action."
