id: erie-peer-disk-full
title: Indexer cluster reports replication factor not met
profiles:
  - erie
summary: One peer has filled its hot storage because the configured volume limit
  exceeds its disk.
topics:
  - erie
  - configuration
  - operations
difficulty: medium
trigger:
  onDemand: true
ticket:
  requester: Platform Operations
  persona: methodical
  urgency: high
  text: Indexer cluster reports replication factor not met. Investigate the
    affected service, correct its configuration, and verify recovery.
changes:
  - host: "{indexer:3}"
    path: /opt/splunk/etc/system/local/indexes.conf
    stanza: volume:hot
    set:
      maxVolumeDataSizeMB: "9000000"
    apply: restart
clues:
  - "{indexer:3}: /opt/splunk/etc/system/local/indexes.conf [volume:hot]"
  - splunk show profile-status on the affected host
  - Apps → Engineer Sandbox → Operations
redHerrings: []
fixChecks:
  all:
    - metric:
        host: "{indexer:3}"
        metric: diskFull
        equals: false
    - metric:
        host: "{cluster_manager}"
        metric: replicationMet
        equals: true
    - metric:
        host: "{cluster_manager}"
        metric: searchFactorMet
        equals: true
recovery:
  seconds: 30
interview:
  prompt: Indexer cluster reports replication factor not met. Walk through
    diagnosis, a scoped fix, and verification.
  timeLimitMinutes: 20
  expectedPath:
    - id: scope
      label: Scoped the affected environment
      any:
        - page: ^(environments|fleet|operations|monitoring)
        - cmd: show\s+profile-status
    - id: inspect
      label: Inspected the effective configuration
      any:
        - cmd: btool|cat|less|grep
  verification:
    - cmd: show\s+profile-status|run\s+playbook
    - page: ^operations
    - search: index=
  unsafe:
    - label: Removing the peer from the cluster
      match:
        cmd: remove.*(peer|indexer)|offline.*enforce-counts
  rootCause:
    - label: One peer has filled its hot storage because the configured volume limit
        exceeds its disk.
      any:
        - volume:hot
        - maxVolumeDataSizeMB
  hints:
    - cost: 10
      text: Inspect the effective configuration on {indexer:3}. File edits need the
        correct reload or restart.
  modelAnswer:
    rootCause: One peer has filled its hot storage because the configured volume
      limit exceeds its disk.
    fix: '{indexer:3}: {"maxVolumeDataSizeMB":"500000"} in
      /opt/splunk/etc/system/local/indexes.conf, then splunk restart'
    verification: Confirm the operational metrics have recovered, inspect fresh
      data, and close the ticket with evidence.
    prevention: Validate configuration before rollout, monitor the affected service,
      and test changes on a limited scope.
  spokenAnswer: One peer has filled its hot storage because the configured volume
    limit exceeds its disk. I would scope the affected service, inspect its
    effective configuration and logs, apply a targeted correction with the
    appropriate reload, then verify fresh data and recovered metrics.

interviewQuestionIds:
  - "IQ033"
  - "IQ162"
followups:
  - "What happens if the replication factor is not met?"
  - "What is your go-to step if the ingestion issue is seen at the indexer, and what are the most common indexer-side causes?"
  - "What would you check next if this change failed?"
  - "How would you verify recovery without hiding data loss?"
requestedEvidence:
  - "Scope the affected service before changing it."
  - "Record the failing hop and winning configuration, with a rejected alternative."
  - "Verify recovery after the correct application step and describe rollback."
  - "Give a stakeholder update and a prevention action."
