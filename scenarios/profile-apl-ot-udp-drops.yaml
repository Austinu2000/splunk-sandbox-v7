id: apl-ot-udp-drops
title: OT logs have gaps during shift changes
profiles:
  - apl
summary: The UDP receive buffer is too small for the modeled shift-change burst.
topics:
  - apl
  - configuration
  - operations
difficulty: medium
trigger:
  onDemand: true
ticket:
  requester: Security Operations
  persona: methodical
  urgency: high
  text: OT logs have gaps during shift changes. Investigate the affected service,
    correct its configuration, and verify recovery.
changes:
  - host: hf-ot01
    path: /opt/splunk/etc/system/local/inputs.conf
    stanza: udp://514
    set:
      receiveBufferSize: "65536"
    apply: restart
clues:
  - "hf-ot01: /opt/splunk/etc/system/local/inputs.conf [udp://514]"
  - splunk show profile-status on the affected host
  - Apps → Engineer Sandbox → Operations
redHerrings: []
fixChecks:
  metric:
    host: hf-ot01
    metric: scada_ics.dropPct
    equals: 0
recovery:
  seconds: 30
interview:
  prompt: OT logs have gaps during shift changes. Walk through diagnosis, a scoped
    fix, and verification.
  timeLimitMinutes: 20
  expectedPath:
    - id: scope
      label: Scoped the affected environment
      any:
        - page: ^(environments|fleet|operations|monitoring)
        - cmd: show\s+profile-status
    - id: inspect
      label: Inspected the effective configuration
      any:
        - cmd: btool|cat|less|grep
  verification:
    - cmd: show\s+profile-status|run\s+playbook
    - page: ^operations
    - search: index=
  unsafe:
    - label: Opening OT networking directly to indexers
      match:
        cmd: iptables.*(ACCEPT|ACCEPT)|firewall-cmd.*9997
  rootCause:
    - label: The UDP receive buffer is too small for the modeled shift-change burst.
      any:
        - udp://514
        - receiveBufferSize
  hints:
    - cost: 10
      text: Inspect the effective configuration on hf-ot01. File edits need the
        correct reload or restart.
  modelAnswer:
    rootCause: The UDP receive buffer is too small for the modeled shift-change burst.
    fix: 'hf-ot01: {"receiveBufferSize":"8388608"} in
      /opt/splunk/etc/system/local/inputs.conf, then splunk restart'
    verification: Confirm the operational metrics have recovered, inspect fresh
      data, and close the ticket with evidence.
    prevention: Validate configuration before rollout, monitor the affected service,
      and test changes on a limited scope.
  spokenAnswer: The UDP receive buffer is too small for the modeled shift-change
    burst. I would scope the affected service, inspect its effective
    configuration and logs, apply a targeted correction with the appropriate
    reload, then verify fresh data and recovered metrics.

interviewQuestionIds:
  - "IQ156"
followups:
  - "Firewall logs are coming in with an ingestion delay - how do you investigate and resolve it?"
  - "What would you check next if this change failed?"
  - "How would you verify recovery without hiding data loss?"
requestedEvidence:
  - "Scope the affected service before changing it."
  - "Record the failing hop and winning configuration, with a rejected alternative."
  - "Verify recovery after the correct application step and describe rollback."
  - "Give a stakeholder update and a prevention action."
