id: apl-shc-bundle-push
title: Search heads have different app configurations
profiles:
  - apl
summary: A conflicting local saved search contains an invalid schedule, so the
  deployer bundle cannot be pushed.
topics:
  - apl
  - configuration
  - operations
difficulty: medium
trigger:
  onDemand: true
ticket:
  requester: Security Operations
  persona: methodical
  urgency: high
  text: Search heads have different app configurations. Investigate the affected
    service, correct its configuration, and verify recovery.
changes:
  - host: "{deployer}"
    path: /opt/splunk/etc/shcluster/apps/profile_search/local/savedsearches.conf
    stanza: Profile health check
    set:
      cron_schedule: invalid
    apply: none
clues:
  - "{deployer}:
    /opt/splunk/etc/shcluster/apps/profile_search/local/savedsearches.conf
    [Profile health check]"
  - splunk show profile-status on the affected host
  - Apps → Engineer Sandbox → Operations
redHerrings: []
fixChecks:
  metric:
    host: "{deployer}"
    metric: membersInSync
    equals: true
recovery:
  seconds: 30
interview:
  prompt: Search heads have different app configurations. Walk through diagnosis,
    a scoped fix, and verification.
  timeLimitMinutes: 20
  expectedPath:
    - id: scope
      label: Scoped the affected environment
      any:
        - page: ^(environments|fleet|operations|monitoring)
        - cmd: show\s+profile-status
    - id: inspect
      label: Inspected the effective configuration
      any:
        - cmd: btool|cat|less|grep
  verification:
    - cmd: show\s+profile-status|run\s+playbook
    - page: ^operations
    - search: index=
  unsafe:
    - label: Copying apps manually to members
      match:
        cmd: (cp|scp|rsync).*apps
        role: search_head
  rootCause:
    - label: A conflicting local saved search contains an invalid schedule, so the
        deployer bundle cannot be pushed.
      any:
        - Profile health check
        - cron_schedule
  hints:
    - cost: 10
      text: Inspect the effective configuration on {deployer}. File edits need the
        correct reload or restart.
  modelAnswer:
    rootCause: A conflicting local saved search contains an invalid schedule, so the
      deployer bundle cannot be pushed.
    fix: '{deployer}: {"cron_schedule":"*/10 * * * *"} in
      /opt/splunk/etc/shcluster/apps/profile_search/local/savedsearches.conf,
      then splunk apply shcluster-bundle'
    verification: Confirm the operational metrics have recovered, inspect fresh
      data, and close the ticket with evidence.
    prevention: Validate configuration before rollout, monitor the affected service,
      and test changes on a limited scope.
  spokenAnswer: A conflicting local saved search contains an invalid schedule, so
    the deployer bundle cannot be pushed. I would scope the affected service,
    inspect its effective configuration and logs, apply a targeted correction
    with the appropriate reload, then verify fresh data and recovered metrics.

interviewQuestionIds:
  - "IQ154"
followups:
  - "A search head cluster member is out of sync, pending, or missing from the cluster. How do you troubleshoot and resolve it?"
  - "What would you check next if this change failed?"
  - "How would you verify recovery without hiding data loss?"
requestedEvidence:
  - "Scope the affected service before changing it."
  - "Record the failing hop and winning configuration, with a rejected alternative."
  - "Verify recovery after the correct application step and describe rollback."
  - "Give a stakeholder update and a prevention action."
